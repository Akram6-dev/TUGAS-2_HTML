<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>DATA DIRI SISWA</h1>
    <form>
        <label>Nama Lengkap</label>
        <input type="text" name="nama" placeholder="Masukkan nama" required>

        <br><br>

        <label>Nomor Induk Asal</label>
        <input type="number" name="email" placeholder="Masukkan nomor induk">

        <br><br>

        <label>NISN</label>
        <input type="number" name="nisn" placeholder="Masukkan NISN">

        <br><br>

        <label>Tempat & Tanggal Lahir</label>
        <input type="date" name="tanggal_lahir" placeholder="Masukkan tanggal lahir">

        <br><br>

        <label>Jenis Kelamin</label>
        <input type="radio" name="jk" value="L"> Laki-laki
        <input type="radio" name="jk" value="P"> Perempuan

        <label>   Agama</label>
        <input type="text" name="agama" placeholder="Masukkan agama">

        <br><br>

        <label>Anak Ke</label>
        <input type="number" name="anak_ke" placeholder="Masukkan anak ke berapa">

        <br><br>

        <label>Status anak dalam keluarga</label>
        <input type="radio" name="Status_anak_dalam_keluarga" value="1"> Anak Kandung
        <input type="radio" name="Status_anak_dalam_keluarga" value="2"> Anak Angkat
        <input type="radio" name="Status_anak_dalam_keluarga" value="3"> Lainnya

        <br><br>
        <label>Alamat Siswa</label>
        <input type="text" name="alamat" placeholder="Masukkan alamat siswa">

        <br><br>

        <label>No Telepon Siswa</label>
        <input type="tel" name="telepon" placeholder="Masukkan no telepon siswa">

        <br><br>

        <label>Sekolah Asal</label>
        <input type="text" name="Asal Sekolah" placeholder="Masukkan sekolah asal">
    </form>


    <h1>DATA ORANG TUA KANDUNG</h1>
    <form>
        <label>Nama Lengkap Ayah</label>
        <input type="text" name="nama_ayah" placeholder="Masukkan nama ayah">

        <br><br>

        <label>Nama Lengkap Ibu</label>
        <input type="text" name="nama_ibu" placeholder="Masukkan nama ibu">

        <br><br>

        <label>Alamat</label>
        <input type="text" name="alamat_ortu" placeholder="Masukkan alamat orang tua">

        <br><br>

        <label>No Telepon</label>
        <input type="tel" name="telepon_ortu" placeholder="Masukkan no telepon orang tua">

        <br><br>
        <label>Pekerjaan Ayah</label>
        <input type="text" name="pekerjaan_ayah" placeholder="Masukkan pekerjaan ayah">
        <label>Pekerjaan Ibu</label>
        <input type="text" name="pekerjaan_ibu" placeholder="Masukkan pekerjaan ibu">

        <br><br>
        <label>pendidikan terakhir ayah</label>
        <input type="text" name="pendidikan_ayah" placeholder="Masukkan pendidikan terakhir ayah">
        <label>pendidikan terakhir ibu</label>
        <input type="text" name="pendidikan_ibu" placeholder="Masukkan pendidikan terakhir ibu">    
    </form>
</body>
</html>
